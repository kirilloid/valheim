<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Help utilities for valheim for those who love efficiency"
    />
    <link rel="manifest" href="/manifest.json" />
    <script>
      window.onerror = function (message) {
        var root = document.getElementById('root');
        var elt = document.createElement('div');
        elt.className = 'error';
        var html = 'There was an error: `' + message + '`. Why this happened?';
        if (root && root.childNodes.length === 0) {
          root.appendChild(elt);
          html += '<br>It\'s either connection glitch (reload the page) or you are using old browser (update it)';
        } else {
          if (root) {
            root.insertBefore(elt, root.firstChild);
          }
          html += '<br>There\'s probably a bug on this site. Report it to me (kirilloid#8246) on Valheim discord.';
        }
        elt.innerHTML = html;
      };
      var features = [];
      if (typeof Array.prototype.at === 'undefined') features.push('Array.prototype.at');
      if (typeof Iterator.prototype.reduce === 'undefined') features.push('Iterator.prototype.reduce');
      if (features.length > 0) {
        const script = document.createElement('script');
        script.src = 'https://polyfill.io/v3/polyfill.min.js?features=' + features.join(',');
        document.head.appendChild(script);
      }
    </script>
    <style>
      @font-face {
        font-family: 'Norse';
        font-weight: 400;
        src: url('/norse.regular.otf') format('opentype');
      }

      @font-face {
        font-family: 'Norse';
        font-weight: 700;
        src: url('/norse.bold.otf') format('opentype');
      }

      @font-face {
        font-family: 'Rune';
        font-weight: 400;
        src: url("/rune.ttf") format("truetype");
      }

      h1, h2, h3, h4 {
        font-family: 'Norse', sans-serif;
      }
    </style>
    <title>Valheim calculators</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
